name: Patternsmith
options:
  bundleIdPrefix: com.iamjarl
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"

packages:
  PatternsmithCore:
    path: ../PatternsmithCore

targets:
  Patternsmith:
    type: application
    platform: macOS
    sources:
      - path: Patternsmith
    dependencies:
      - package: PatternsmithCore
        product: PatternsmithCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iamjarl.patternsmith
        PRODUCT_NAME: Patternsmith
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Patternsmith
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Patternsmith/Patternsmith.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        DEAD_CODE_STRIPPING: YES

schemes:
  Patternsmith:
    build:
      targets:
        Patternsmith: all
    run:
      config: Debug
    archive:
      config: Release
