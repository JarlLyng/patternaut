name: Patternaut
options:
  bundleIdPrefix: com.iamjarl
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"

packages:
  PatternautCore:
    path: ../PatternautCore

targets:
  Patternaut:
    type: application
    platform: macOS
    sources:
      - path: Patternaut
    dependencies:
      - package: PatternautCore
        product: PatternautCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iamjarl.patternaut
        PRODUCT_NAME: Patternaut
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        VERSIONING_SYSTEM: apple-generic
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Patternaut
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: KDWZ3WNLDK
        CODE_SIGN_ENTITLEMENTS: Patternaut/Patternaut.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        DEAD_CODE_STRIPPING: YES

schemes:
  Patternaut:
    build:
      targets:
        Patternaut: all
    run:
      config: Debug
    archive:
      config: Release
