name: Patternaut
options:
  bundleIdPrefix: com.iamjarl
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"

packages:
  PatternautCore:
    path: ../PatternautCore
  IAMJARLDesign:
    url: https://github.com/jarllyng/iamjarl-design.git
    from: 1.9.1

targets:
  Patternaut:
    type: application
    platform: macOS
    sources:
      - path: Patternaut
    dependencies:
      - package: PatternautCore
        product: PatternautCore
      - package: IAMJARLDesign
        product: IAMJARLDesignTokens
    info:
      path: Patternaut/Info.plist
      properties:
        CFBundleDisplayName: Patternaut
        # Start with a blank document instead of an open panel.
        NSShowAppCentricOpenPanelInsteadOfUntitledFile: false
        # Must follow the build settings, or TestFlight uploads all claim 1.0 (1).
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.music
        ITSAppUsesNonExemptEncryption: false
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: "Copyright © 2026 Jarl Lyng"
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.iamjarl.patternaut.project
            UTTypeDescription: Patternaut Project
            UTTypeConformsTo:
              - public.data
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - patternaut
        CFBundleDocumentTypes:
          - CFBundleTypeName: Patternaut Project
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.iamjarl.patternaut.project
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iamjarl.patternaut
        PRODUCT_NAME: Patternaut
        MARKETING_VERSION: "0.6.0"
        CURRENT_PROJECT_VERSION: "1"
        VERSIONING_SYSTEM: apple-generic
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: KDWZ3WNLDK
        CODE_SIGN_ENTITLEMENTS: Patternaut/Patternaut.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        DEAD_CODE_STRIPPING: YES

schemes:
  Patternaut:
    build:
      targets:
        Patternaut: all
    run:
      config: Debug
    archive:
      config: Release
