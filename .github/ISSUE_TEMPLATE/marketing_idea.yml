name: Idea for the site or store page
description: Something on the website, the App Store page or the screenshots that could be better.
title: '[Site] '
labels: ['marketing']
body:
  - type: markdown
    attributes:
      value: |
        For the website, the App Store page and the screenshots: a sentence that reads wrong, a screenshot that is out of date, something a Tracker owner would want to know first.

  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you change, and why?
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - App Store page
        - Website
        - Screenshots
        - Other
    validations:
      required: true
